---

# ── Configure ────────────────────────────────────────────────
- name: Create Vault config file
  ansible.builtin.copy:
    dest: "{{ vault_config_dir }}/vault.hcl"
    owner: root
    group: root
    mode: '0640'
    content: |
      storage "raft" {
        path    = "{{ vault_data_dir }}"
        node_id = "{{ inventory_hostname }}"

        retry_join {
          leader_api_addr = "{{ vault_leader_addr }}"
        }
      }

      listener "tcp" {
        address     = "0.0.0.0:8200"
        tls_disable = {{ vault_tls_disable | lower }}
      }

      api_addr     = "http://{{ ansible_default_ipv4.address }}:8200"
      cluster_addr = "http://{{ ansible_default_ipv4.address }}:8201"
      disable_mlock = false
      ui = true

      log_level = "info"
      log_file  = "{{ vault_log_dir }}/vault.log"

    # ── Firewall ─────────────────────────────────────────────────
- name: Start firewalld if not running
  ansible.builtin.systemd:
    name: firewalld
    state: started
    enabled: true
  failed_when: false

# ── Start Service ────────────────────────────────────────────
- name: Enable and start Vault
  ansible.builtin.systemd:
    name: vault
    enabled: true
    state: started

# ── Verify ───────────────────────────────────────────────────
- name: Wait for Vault to be reachable
  ansible.builtin.uri:
    url: "http://{{ ansible_default_ipv4.address }}:8200/v1/sys/health"
    method: GET
    status_code: [200, 429, 472, 473, 501, 503]
  register: vault_health
  retries: 10
  delay: 3
  until: vault_health.status in [200, 429, 472, 473, 501, 503]

- name: Join Raft cluster
  ansible.builtin.command:
    cmd: "{{ vault_install_dir }}/vault operator raft join {{ vault_leader_addr }}"
  environment:
    VAULT_ADDR: "http://{{ ansible_default_ipv4.address }}:8200"
  become: true
  when: vault_health.status == 501
  register: raft_join
  changed_when: "'joined' in raft_join.stdout"

- name: Show Vault status
  ansible.builtin.debug:
    msg: >
      Vault is reachable at http://{{ ansible_default_ipv4.address }}:8200
      Status code: {{ vault_health.status }}
      {% if vault_health.status == 501 %}
      ⚠️  Vault is NOT yet initialized. Run:
          vault operator init
      {% elif vault_health.status == 503 %}
      ⚠️  Vault is sealed. Run:
          vault operator unseal
      {% else %}
      ✅ Vault is initialized and unsealed.
      {% endif %}
