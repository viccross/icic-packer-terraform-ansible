---
- name: Install dependencies
  ansible.builtin.package:
    name:
      - curl
      - unzip
      - libcap
    state: present

- name: Create Vault directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  loop:
    - "/etc/vault.d"
    - "/opt/vault/data"
    - "/var/log/vault"

- name: Install Vault
  become: true
  ansible.builtin.copy:
    src: /home/jenkins/go/bin/vault
    dest: /usr/local/bin/vault
    mode: '0755'
    owner: root
    group: root

- name: Set IPC_LOCK capability on Vault binary
  ansible.builtin.command:
    cmd: "setcap cap_ipc_lock=+ep /usr/local/bin/vault"
  changed_when: true

- name: Ensure path for Vault systemd service
  become: true
  ansible.builtin.file:
    path: /usr/local/lib/systemd/system
    state: directory
    mode: '0755'
    owner: root
    group: root

- name: Create Vault systemd service
  become: true
  ansible.builtin.template:
    src: templates/vault.service.j2
    dest: /usr/local/lib/systemd/system/vault.service
    mode: '0644'
    owner: root
    group: root

- name: Reload systemd daemon
  become: true
  ansible.builtin.systemd:
    daemon_reload: true

- name: Disable Vault service for now
  become: true
  ansible.builtin.systemd:
    name: vault
    enabled: false
    state: stopped

- name: Enable Vault firewall rules
  become: true
  ansible.posix.firewalld:
    port: 8200-8201/tcp
    immediate: true
    permanent: true
    state: enabled
